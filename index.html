<style>
/* Layout: app mobile com cabeçalho fixo, páginas em coluna única e navegação inferior; tema escuro com acento trocável */
:root{
  --bg:#07080d; --bg2:#0d0f18; --card:#12151f; --card2:#171b28; --line:#232840;
  --fg:#e8ebf5; --mut:#8c93ad; --ok:#38d996; --warn:#f5b84a; --bad:#ff5468;
  --a1:#2f7bff; --a2:#8a4dff; --a3:#ff3b5c; --a4:#19d3f0; --acc:var(--a4);
  --grad:linear-gradient(90deg,#2f7bff,#8a4dff,#ff3b5c,#19d3f0,#2f7bff);
  --f-d:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-b:'Barlow','Segoe UI',system-ui,sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html[data-th="azul"]{--acc:#2f7bff;--grad:linear-gradient(90deg,#2f7bff,#19d3f0,#2f7bff)}
html[data-th="vermelho"]{--acc:#ff3b5c;--grad:linear-gradient(90deg,#ff3b5c,#ff8a3d,#ff3b5c)}
html[data-th="roxo"]{--acc:#8a4dff;--grad:linear-gradient(90deg,#8a4dff,#d24dff,#8a4dff)}
html[data-th="ciano"]{--acc:#19d3f0;--grad:linear-gradient(90deg,#19d3f0,#38d996,#19d3f0)}
html[data-th="preto"]{--bg:#000;--bg2:#050505;--card:#0b0b0d;--card2:#111114;--line:#1d1d22;--acc:#d9dbe6;--grad:linear-gradient(90deg,#8c93ad,#e8ebf5,#8c93ad)}
html[data-th="rgb"]{--acc:var(--a4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-b);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
.sig{font-family:var(--f-d);font-weight:700;letter-spacing:.14em;background:var(--grad);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad);background-size:300% 100%;animation:flow 6s linear infinite}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font:700 17px var(--f-d);letter-spacing:.08em}
.brand small{font-size:10px}
.chip{font:600 11px var(--f-d);letter-spacing:.06em;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--mut);white-space:nowrap}
main{padding-block:16px 96px;min-width:0}
.page{display:none;animation:in .28s ease}
.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin-bottom:4px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}
.card h3{font-size:15px;margin-bottom:6px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:4px}
.tile:active,.btn:active{transform:scale(.97)}
.tile b{font:600 14px var(--f-d)}
.tile span{font-size:12px;color:var(--mut)}
.tile svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:600 13px var(--f-d);letter-spacing:.05em;cursor:pointer;transition:.15s}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#05060a}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.sl{display:grid;grid-template-columns:1fr 78px;gap:6px 12px;align-items:center;margin-bottom:14px}
.sl label{font:600 13px var(--f-d);letter-spacing:.04em}
.sl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc);height:28px;margin:0}
.sl input[type=number],input.txt,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.sl input[type=number]{text-align:center;font-family:var(--f-m);grid-row:1;grid-column:2}
textarea{font:12px/1.4 var(--f-m);min-height:120px;resize:vertical}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{overflow-wrap:anywhere}
.na{color:var(--warn)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.pill{display:inline-block;font:600 11px var(--f-d);padding:3px 8px;border-radius:999px;border:1px solid var(--line);margin-right:4px}
.code{font:12px/1.5 var(--f-m);background:#05060a;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre;margin:6px 0;color:#bfe9ff}
.cmd .meta{font-size:13px;color:var(--mut);margin:4px 0}
.cmd h4{margin:0;font:600 15px var(--f-d)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.tabs button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 12px var(--f-d);cursor:pointer;color:var(--mut)}
.tabs button.on{color:#05060a;background:var(--acc);border-color:var(--acc)}
.prof{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card2)}
.prof.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.prof b{font:600 14px var(--f-d)}
.prof small{color:var(--mut);display:block;font-size:12px}
.big{font:700 34px var(--f-d);color:var(--acc)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:84px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 auto 0 0;background:var(--grad);background-size:300% 100%;border-radius:4px;transition:width .3s}
.note{font-size:12px;color:var(--mut);border-left:2px solid var(--warn);padding-left:10px;margin:8px 0}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bot button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10px var(--f-d);letter-spacing:.05em;color:var(--mut);padding:6px 0;cursor:pointer;border-radius:8px}
nav.bot button.on{color:var(--acc)}
nav.bot svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw button{height:64px;border-radius:12px;border:2px solid var(--line);cursor:pointer;font:700 13px var(--f-d);color:#fff;text-shadow:0 1px 3px #000}
.sw button.on{border-color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:700px){body{max-width:720px;margin:0 auto}}
</style>

const DEV={ready:false,manufacturer:null,model:null,android:null,androidNote:'',w:null,h:null,dpr:null,dpi:null,hz:null,mem:null,cores:null,touch:null};
async function detectDevice(){
  try{
    const ua=navigator.userAgent||'';
    const uad=navigator.userAgentData;
    let model=null,pv=null;
    if(uad&&uad.getHighEntropyValues){
      try{const hv=await uad.getHighEntropyValues(['model','platformVersion','platform']);
        if(hv.model&&hv.model.length>1)model=hv.model;
        if(hv.platformVersion)pv=hv.platformVersion;
        if(hv.platform)DEV.platform=hv.platform;
      }catch(e){}
    }
    if(!model){const m=ua.match(/Android[^;]*;\s*([^;)]+?)(?:\sBuild|\)|;)/);if(m&&m[1].trim().length>1&&!/^K$/.test(m[1].trim()))model=m[1].trim()}
    DEV.model=model;
    if(model){
      if(/^moto|^XT\d/i.test(model))DEV.manufacturer='Motorola';
      else if(/^SM-/i.test(model))DEV.manufacturer='Samsung';
      else if(/^(M\d{4}|2\d{6,}|Redmi|POCO|Mi\s)/i.test(model))DEV.manufacturer='Xiaomi (provável)';
    }
    if(pv){DEV.android=String(pv).split('.')[0]}
    else{const m=ua.match(/Android\s([\d.]+)/);if(m){DEV.android=m[1].split('.')[0];DEV.androidNote='O navegador pode reportar uma versão reduzida. Confirme em Configurações > Sobre o telefone.'}}
    DEV.isAndroid=/Android/i.test(ua);
    const dpr=window.devicePixelRatio||1;
    DEV.dpr=dpr;DEV.w=Math.round(screen.width*dpr);DEV.h=Math.round(screen.height*dpr);
    DEV.dpi=Math.round(dpr*160);
    DEV.mem=navigator.deviceMemory||null;
    DEV.cores=navigator.hardwareConcurrency||null;
    DEV.touch=navigator.maxTouchPoints||0;
  }catch(e){}
  DEV.ready=true;
  measureHz();
}
function measureHz(){
  return new Promise(res=>{
    try{
      const ts=[];let n=0;
      const step=t=>{ts.push(t);if(++n<70)requestAnimationFrame(step);else{
        const d=[];for(let i=1;i<ts.length;i++)d.push(ts[i]-ts[i-1]);
        d.sort((a,b)=>a-b);const med=d[Math.floor(d.length/2)];
        const raw=1000/med;const std=[30,48,60,90,120,144];
        DEV.hz=std.reduce((p,c)=>Math.abs(c-raw)<Math.abs(p-raw)?c:p);
        DEV.hzRaw=Math.round(raw);res();if(typeof renderCurrent==='function')renderCurrent();
      }};
      requestAnimationFrame(step);
    }catch(e){res()}
  });
}
function deviceProfile(){
  if(S.devOverride){const d=DEVICES.find(x=>x.id===S.devOverride);if(d)return {d,src:'manual'}}
  if(S.devOverride==='generic')return {d:GENERIC,src:'manual'};
  const m=DEV.model||'',b=DEV.manufacturer||'';
  const d=DEVICES.find(x=>x.match(m,b));
  return d?{d,src:'auto'}:{d:GENERIC,src:'auto'};
}
function compat(){
  const {d,src}=deviceProfile();
  if(d.full)return {txt:'Compatível: perfil completo',cls:'ok',d,src};
  if(d.id!=='generic')return {txt:'Parcial: perfil genérico da marca',cls:'na',d,src};
  return {txt:'Genérico: sem perfil específico',cls:'na',d,src};
}
const devName=()=>{const {d,src}=deviceProfile();return (src==='manual'||DEV.model)?(DEV.model&&src==='auto'?DEV.model:d.name):'Aparelho não identificado'};

/* ===== Sugestão local de sensibilidade ===== */
const PREF_MAP={capa:'CAPA',puxada:'PUXADA',precisao:'PRECISÃO',equilibrado:'EQUILIBRADO'};
function suggest(){
  const {d}=deviceProfile();
  const base=PRESETS[PREF_MAP[S.pref]||'EQUILIBRADO'];
  const why=[`Preferência: ${S.pref}.`];
  const out={};
  const hz=DEV.hz||d.hz||60;
  const weak=(DEV.mem&&DEV.mem<=4)||(DEV.cores&&DEV.cores<=6);
  for(const [k] of KEYS){
    let v=base[k];
    v+=d.bias[k]||0;
    if(hz>=120&&(k==='geral'||k==='olh'))v+=4;
    if(hz<=60&&k==='geral')v-=4;
    if(weak&&(k==='geral'||k==='red'))v-=4;
    v=Math.round(v*0.75+cur().vals[k]*0.25);
    v+=Math.round((Math.random()-0.5)*12);
    out[k]=clamp(v);
  }
  if(d.id!=='generic'&&(d.bias.geral||d.bias.x4))why.push(`Ajuste do aparelho: ${d.name}.`);
  why.push(`Taxa de atualização considerada: ${hz} Hz${DEV.hz?' (medida)':d.hz?' (referência do modelo)':' (padrão assumido)'}.`);
  if(weak)why.push('Capacidade do aparelho: valores levemente menores no geral e no ponto vermelho.');
  else if(DEV.mem||DEV.cores)why.push('Capacidade do aparelho: sem ajuste necessário.');
  else why.push('Capacidade do aparelho: informação indisponível, sem ajuste.');
  if(DEV.android)why.push(`Android ${DEV.android}: informativo, sem efeito nos números.`);
  why.push('25% do resultado vem dos valores atuais do perfil ativo.');
  return {vals:out,why,pref:S.pref,at:Date.now()};
}

function addProfile(name,vals){
  name=String(name||'').trim().slice(0,24);
  if(!name){toast('Digite um nome para o perfil.');return null}
  if(S.order.length>=50){toast('Limite de 50 perfis atingido.');return null}
  let n=name,i=2;const names=S.order.map(id=>S.profiles[id].name.toLowerCase());
  while(names.includes(n.toLowerCase()))n=`${name} ${i++}`;
  const id=uid();
  const v={};for(const [k] of KEYS)v[k]=clamp(vals[k]);
  S.profiles[id]={name:n,vals:v,builtin:false};S.order.push(id);
  return id;
}
function profileAction(a,id){
  if(a==='sel'){S.active=id;toast('Perfil ativo: '+S.profiles[id].name)}
  else if(a==='edit'){editId=id}
  else if(a==='editno'){editId=null}
  else if(a==='editvals'){S.active=id;editId=null;save();go('sens');return}
  else if(a==='rename'){
    const v=$('#ed-name').value.trim().slice(0,24);
    if(!v){toast('O nome não pode ficar vazio.');return}
    S.profiles[editId].name=v;toast('Nome salvo.')
  }
  else if(a==='dup'){const nid=addProfile(S.profiles[id].name+' cópia',S.profiles[id].vals);if(nid)toast('Perfil duplicado.')}
  else if(a==='del'){pendingDel=id}
  else if(a==='delno'){pendingDel=null}
  else if(a==='delok'){
    if(S.order.length<=1){toast('É preciso manter ao menos um perfil.');pendingDel=null}
    else{delete S.profiles[id];S.order=S.order.filter(x=>x!==id);if(S.active===id)S.active=S.order[0];if(editId===id)editId=null;pendingDel=null;toast('Perfil excluído.')}

    const nid=addProfile($('#new-name').value,cur().vals);
    if(nid){S.active=nid;toast('Perfil criado e ativado.')}

}

    <div class="kv"><span>Núcleos de CPU</span>${v(DEV.cores)}</div>

  </div>
  ${DEV.androidNote?`<div class="note">${esc(DEV.androidNote)}</div>`:''}
  <div class="note">Um navegador não acessa tudo do aparelho. Se o modelo não foi identificado, escolha-o manualmente em Por aparelho. Para valores exatos, veja Configurações do Android > Sobre o telefone.</div>
  <button class="btn" data-act="rediag">Atualizar diagnóstico</button>`;
};

PAGES.aparelhos=()=>{
  const {d,src}=deviceProfile();
  return `<h2>Por aparelho</h2><p class="sub">Recomendações conforme o modelo.</p>
  <div class="card"><h3>Seu aparelho</h3>
    <label for="dev-sel" class="sub">Perfil em uso ${src==='auto'?'(detectado)':'(escolhido por você)'}</label>
    <select id="dev-sel"><option value="">Automático</option>${DEVICES.map(x=>`<option value="${x.id}" ${S.devOverride===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="generic" ${S.devOverride==='generic'?'selected':''}>Genérico</option></select></div>
  <div class="card"><h3>${esc(d.name)}</h3>
    ${Object.entries(d.spec||{}).map(([k,val])=>`<div class="kv"><span>${esc(k)}</span><span>${esc(val)}</span></div>`).join('')}
    <ul style="padding-left:18px;font-size:14px;display:grid;gap:6px;margin:8px 0 0">${d.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    ${d.full?'<div class="note">Fonte das especificações: dados públicos do fabricante. Confirme os números do seu aparelho no Diagnóstico.</div>':''}</div>
  <div class="card"><h3>Perfis disponíveis</h3>
    ${DEVICES.map(x=>`<div class="kv"><span>${esc(x.name)}</span><span class="${x.full?'ok':'na'}">${x.full?'Completo':'Genérico da marca'}</span></div>`).join('')}</div>`;
};

function snapData(){return {profiles:JSON.parse(JSON.stringify(S.profiles)),order:[...S.order],active:S.active,theme:S.theme,pref:S.pref}}
function addSnapshot(label){
  S.backups.unshift({id:uid(),ts:Date.now(),label,data:snapData()});
  S.backups=S.backups.slice(0,10);save();
}
function exportText(){
  return JSON.stringify({app:'SENSI Z7KX BR',version:2,exportedAt:new Date().toISOString(),profiles:S.order.map(id=>({name:S.profiles[id].name,vals:S.profiles[id].vals}))},null,2);
}
function parseImport(text){
  if(!text||!text.trim())return {err:'Cole o conteúdo do arquivo JSON.'};
  if(text.length>300000)return {err:'Arquivo grande demais.'};
  let d;try{d=JSON.parse(text)}catch(e){return {err:'O texto não é um JSON válido.'}}
  if(!d||typeof d!=='object'||d.app!=='SENSI Z7KX BR')return {err:'Este arquivo não é um backup do SENSI Z7KX BR.'};
  if(d.version!==2)return {err:'Versão de arquivo não suportada.'};
  if(!Array.isArray(d.profiles)||!d.profiles.length||d.profiles.length>50)return {err:'Lista de perfis ausente ou com mais de 50 itens.'};
  const out=[];
  for(const [i,p] of d.profiles.entries()){
    if(!p||typeof p.name!=='string'||!p.name.trim()||p.name.length>24)return {err:`Perfil ${i+1}: nome inválido.`};
    if(!p.vals||typeof p.vals!=='object')return {err:`Perfil ${i+1}: valores ausentes.`};
    const v={};
    for(const [k,l] of KEYS){const n=p.vals[k];if(typeof n!=='number'||!Number.isFinite(n)||n<0||n>200)return {err:`Perfil "${p.name}": ${l} deve estar entre 0 e 200.`};v[k]=Math.round(n)}
    out.push({name:p.name.trim(),vals:v});
  }
  return {profiles:out};
}
function restoreSnapshot(sn){
  try{
    const dd=sn.data;if(!dd||!Array.isArray(dd.order)||!dd.profiles)throw 0;
    const profiles={},order=[];
    for(const id of dd.order){const p=dd.profiles[id];if(!p||typeof p.name!=='string')continue;
      const v={};for(const [k] of KEYS)v[k]=clamp(p.vals&&p.vals[k]);
      profiles[id]={name:p.name.slice(0,24),vals:v,builtin:!!p.builtin};order.push(id)}
    if(!order.length)throw 0;
    S.profiles=profiles;S.order=order;S.active=profiles[dd.active]?dd.active:order[0];
    if(THEMES.some(t=>t[0]===dd.theme))S.theme=dd.theme;
    save();applyTheme();return true;
  }catch(e){return false}
}
const fmt=ts=>new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
PAGES.backup=()=>`<h2>Backup</h2><p class="sub">Exportar, importar e proteger seus perfis.</p>
  <div class="card"><h3>Cópias de segurança</h3>
    <button class="btn pri" data-act="snap">Criar cópia de segurança agora</button>
    <div style="margin-top:10px">${S.backups.length?S.backups.map(b=>`<div class="prof"><div style="min-width:0"><b>${esc(b.label)}</b><small>${fmt(b.ts)} · ${b.data.order.length} perfis</small></div><div class="row"><button class="btn" data-bk="restore" data-id="${b.id}">Restaurar</button><button class="btn bad" data-bk="del" data-id="${b.id}">Excluir</button></div></div>`).join(''):'<p class="sub" style="margin:0">Nenhuma cópia ainda.</p>'}</div>
    <p class="note">Guarda até 10 cópias neste aparelho. Antes de importar ou restaurar, o app cria uma cópia automática.</p></div>
  <div class="card"><h3>Exportar perfis (JSON)</h3>
    <textarea id="exp" readonly>${esc(exportText())}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn pri" data-act="expcopy">Copiar JSON</button></div>
    <p class="note">Cole o texto copiado em um arquivo .json ou numa mensagem para guardar fora do aparelho.</p></div>
  <div class="card"><h3>Importar perfis</h3>
    <label for="imp-file" class="sub">Escolha um arquivo .json ou cole o conteúdo abaixo</label>
    <input type="file" id="imp-file" accept=".json,application/json" class="txt" style="padding:6px">
    <textarea id="imp" placeholder='{"app":"SENSI Z7KX BR", ...}' style="margin-top:8px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn pri" data-act="imp">Validar e importar</button></div>
    <p class="note">O arquivo é validado antes. Os perfis importados são adicionados aos seus, sem apagar nada.</p></div>`;
const AFTERB=()=>{
  const f=$('#imp-file');if(!f)return;
  f.addEventListener('change',()=>{const file=f.files[0];if(!file)return;
    if(file.size>300000){toast('Arquivo grande demais.');return}
    const r=new FileReader();r.onload=()=>{$('#imp').value=String(r.result);toast('Arquivo lido. Toque em Validar e importar.')};
    r.onerror=()=>toast('Não foi possível ler o arquivo.');r.readAsText(file)});
};
AFTER.backup=AFTERB;
AFTER.aparelhos=()=>{$('#dev-sel').addEventListener('change',e=>{S.devOverride=e.target.value;save();renderCurrent()})};

function applyTheme(){document.documentElement.dataset.th=S.theme}
PAGES.temas=()=>`<h2>Temas</h2><p class="sub">A troca vale na hora.</p>
  <div class="sw">${THEMES.map(([id,l,bg])=>`<button data-theme="${id}" class="${S.theme===id?'on':''}" style="background:${bg}">${l}</button>`).join('')}</div>
  <div class="card" style="margin-top:12px;text-align:center"><div class="sig">BY: MACIELZ7KX</div></div>`;

PAGES.mais=()=>`<h2>Mais</h2><p class="sub">Todas as áreas do app.</p><div class="grid">
  <button class="tile" data-go="ia">${ic('ia')}<b>Sensibilidade IA</b><span>Sugestões 0 a 200</span></button>
  <button class="tile" data-go="fps">${ic('fps')}<b>Painel FPS</b><span>Estabilidade</span></button>
  <button class="tile" data-go="diag">${ic('diag')}<b>Diagnóstico</b><span>Dados do aparelho</span></button>
  <button class="tile" data-go="aparelhos">${ic('dev')}<b>Por aparelho</b><span>Recomendações</span></button>
  <button class="tile" data-go="backup">${ic('bak')}<b>Backup</b><span>Exportar e importar</span></button>
  <button class="tile" data-go="temas">${ic('tema')}<b>Temas</b><span>Cores do app</span></button></div>`;

/* ===== Eventos ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-pf],[data-copy],[data-cat],[data-pref],[data-theme],[data-bk]');
  if(!t)return;
  try{
    if(t.dataset.go)return go(t.dataset.go);
    if(t.dataset.pf)return profileAction(t.dataset.pf,t.dataset.id);
    if(t.dataset.cat!==undefined){brevCat=+t.dataset.cat;return renderCurrent()}
    if(t.dataset.pref){S.pref=t.dataset.pref;save();return renderCurrent()}
    if(t.dataset.theme){S.theme=t.dataset.theme;applyTheme();save();return renderCurrent()}
    if(t.dataset.copy){
      const [ci,ii,w]=t.dataset.copy.split('-');const it=BREV[ci].items[ii];
      return copy(w==='r'?it.r:it.c,w==='r'?'Reversão copiada. Ainda não foi executada.':'Comando copiado. Ele ainda não foi executado: cole e execute no Brevent.')
    }
    if(t.dataset.bk){
      const b=S.backups.find(x=>x.id===t.dataset.id);if(!b)return;
      if(t.dataset.bk==='del'){S.backups=S.backups.filter(x=>x!==b);save();return renderCurrent()}
      addSnapshot('Automática antes de restaurar');
      return (restoreSnapshot(b)?toast('Cópia restaurada.'):toast('Cópia inválida, nada foi alterado.'),renderCurrent());
    }
    const a=t.dataset.act;
    if(a==='savecur'){save();toast('Perfil "'+cur().name+'" salvo.')}
    else if(a==='restore'){const id=S.active;const base=cur().builtin&&PRESETS[id.slice(2)]?PRESETS[id.slice(2)]:DEF;cur().vals={...base};save();renderCurrent();toast('Padrões restaurados.')}
    else if(a==='saveas'){const id=addProfile('Novo perfil',cur().vals);if(id){S.active=id;editId=id;save();go('perfis');toast('Perfil criado. Dê um nome a ele.')}}
    else if(a==='gen'){S.lastAI=suggest();save();renderCurrent()}
    else if(a==='aiapply'&&S.lastAI){cur().vals={...S.lastAI.vals};save();toast('Aplicado ao perfil "'+cur().name+'".')}
    else if(a==='aisave'&&S.lastAI){const id=addProfile('IA '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),S.lastAI.vals);if(id){S.active=id;save();toast('Perfil criado e ativado.')}}
    else if(a==='remeasure'||a==='rediag'){toast('Medindo...');detectDevice().then(()=>renderCurrent())}
    else if(a==='snap'){addSnapshot('Manual');renderCurrent();toast('Cópia criada.')}
    else if(a==='expcopy'){copy($('#exp').value,'JSON copiado.')}
    else if(a==='imp'){
      const r=parseImport($('#imp').value);
      if(r.err)return toast(r.err);
      addSnapshot('Automática antes de importar');
      let n=0;for(const p of r.profiles){if(addProfile(p.name,p.vals))n++}
      save();renderCurrent();toast(n+' perfil(is) importado(s).');
    }
  }catch(err){toast('Algo deu errado, nada foi perdido.')}
});
window.addEventListener('hashchange',route);

/* ===== Início ===== */
load();applyTheme();
route();
detectDevice().then(()=>renderCurrent());
</script>
